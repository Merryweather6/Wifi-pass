<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-transition { transition: opacity 0.4s ease-in-out; }
        .hidden-screen { opacity: 0; pointer-events: none; position: absolute; inset: 0; }
        .active-screen { opacity: 1; pointer-events: auto; position: relative; }
    </style>
</head>
<body class="bg-black text-white h-screen w-full overflow-hidden font-sans">
    <div class="max-w-md mx-auto h-full relative border-x border-white/10 sm:border-y sm:rounded-[3rem] sm:my-4 sm:h-[calc(100vh-2rem)] sm:shadow-2xl overflow-hidden">
        
        <!-- Screen 1: Minimalist Name & Button -->
        <div id="screen1" class="fade-transition active-screen h-full flex flex-col items-center justify-center gap-6 bg-black">
            <h1 class="text-6xl font-bold tracking-tight">G_spot</h1>
            <button onclick="showScreen2()" class="bg-[#1c1c1e] hover:bg-[#2c2c2e] active:bg-[#3c3c3e] text-white font-medium py-3 px-8 rounded-full transition-colors duration-200">
                click to find 😉
            </button>
        </div>

        <!-- Screen 2: Split View (Image Top / Details Bottom) -->
        <div id="screen2" class="fade-transition hidden-screen h-full flex flex-col bg-black">
            
            <!-- Top Half (50%): Image & Floating Back Button -->
            <div class="h-1/2 relative w-full border-b border-white/10">
                <!-- Floating Back Button -->
                <button onclick="showScreen1()" class="absolute top-6 left-6 z-10 bg-black/40 backdrop-blur-md hover:bg-black/60 text-white p-3 rounded-full flex items-center justify-center transition-all border border-white/10 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
                </button>
                
                <!-- Travolta GIF/Image -->
                <img src="travolta-desert.png” alt="Where is the Wi-Fi?" class="w-full h-full object-cover">
            </div>

            <!-- Bottom Half (50%): Password Card -->
            <div class="h-1/2 p-6 flex flex-col justify-center bg-black">
                <div class="bg-white/5 border border-white/10 rounded-3xl p-6 backdrop-blur-xl shadow-2xl relative overflow-hidden w-full">
                    
                    <div class="text-xs text-white/40 mb-3 font-bold tracking-widest uppercase">Password</div>
                    
                    <!-- Action Buttons Area -->
                    <div class="flex gap-3 mb-6">
                        <button id="copyBtn" onclick="copyPassword()" class="flex-1 bg-white/10 hover:bg-white/20 active:bg-white/30 text-white font-semibold py-4 px-4 rounded-2xl backdrop-blur-lg transition-all duration-200 flex items-center justify-center gap-2 border border-white/10">
                            <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                            <span id="copyText">Tap to copy password</span>
                        </button>
                        <button onclick="togglePassword()" class="flex-none w-[60px] h-[56px] bg-white/10 hover:bg-white/20 active:bg-white/30 text-white rounded-2xl backdrop-blur-lg transition-all duration-200 flex items-center justify-center border border-white/10">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        </button>
                    </div>

                    <!-- OS Settings Deep Links -->
                    <div class="flex items-center gap-3 mb-4">
                        <div class="h-px bg-white/10 flex-1"></div>
                        <p class="text-[10px] text-center text-white/30 uppercase tracking-widest font-bold">Open Settings</p>
                        <div class="h-px bg-white/10 flex-1"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="App-Prefs:root=WIFI" class="bg-white/5 hover:bg-white/10 text-white/80 py-3 rounded-xl border border-white/5 flex items-center justify-center gap-2 text-sm font-medium transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="h-4 w-4 fill-current"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 24 184.8 8 277.3c-1.9 11.2-1.2 23.3 1.2 35.8 17.5 91.5 73.1 143 114.7 143 37.9 0 54-24 93.3-24 39.3 0 53.6 24.1 94.3 24.1 36.6 0 82.5-43 103-102.3-34.9-15.6-55.6-50.4-55.8-85.2zm-97.4-152.1c15-20.1 27.2-46.7 24-74.1-23.7 2.1-51.4 16.5-67.6 36.4-14.8 18.2-28.5 45.4-24 71.9 26 2.3 50.8-14 67.6-34.2z"/></svg>
                            iPhone
                        </a>
                        <a href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end" class="bg-white/5 hover:bg-white/10 text-white/80 py-3 rounded-xl border border-white/5 flex items-center justify-center gap-2 text-sm font-medium transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" class="h-4 w-4 fill-current"><path d="M420.55 301.93a24 24 0 1 1 24-24 24 24 0 0 1-24 24m-265.1 0a24 24 0 1 1 24-24 24 24 0 0 1-24 24m273.7-144.48 47.94-83a10 10 0 1 0-17.27-10h-.05l-48.54 84.07a283.84 283.84 0 0 0-123.23-28.16 287.69 287.69 0 0 0-123.23 28.16l-48.54-84.07a10 10 0 1 0-17.27 10l47.94 83C64.53 202.22 8.24 285.55 0 384h576c-8.24-98.45-64.54-181.78-146.85-226.55"/></svg>
                            Android
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const password = "Hardtofind!1606";
        let isShowing = false;

        function showScreen2() {
            document.getElementById('screen1').classList.replace('active-screen', 'hidden-screen');
            document.getElementById('screen2').classList.replace('hidden-screen', 'active-screen');
        }

        function showScreen1() {
            document.getElementById('screen2').classList.replace('active-screen', 'hidden-screen');
            document.getElementById('screen1').classList.replace('hidden-screen', 'active-screen');
        }

        function togglePassword() {
            isShowing = !isShowing;
            const copyText = document.getElementById('copyText');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (isShowing) {
                copyText.innerText = password;
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                copyText.innerText = "Tap to copy password";
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        function copyPassword() {
            navigator.clipboard.writeText(password).then(() => {
                const btn = document.getElementById('copyBtn');
                const text = document.getElementById('copyText');
                const icon = document.getElementById('copyIcon');
                
                const originalBg = btn.className;
                const originalText = isShowing ? password : "Tap to copy password";
                const originalIcon = icon.innerHTML;

                btn.className = "flex-1 bg-green-500/20 text-green-400 font-semibold py-4 px-4 rounded-2xl backdrop-blur-lg transition-all duration-200 flex items-center justify-center gap-2 border border-green-500/50";
                text.innerText = "Copied!";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />`;

                setTimeout(() => {
                    btn.className = originalBg;
                    text.innerText = isShowing ? password : "Tap to copy password";
                    icon.innerHTML = originalIcon;
                }, 2000);
            });
        }
    </script>
</body>
</html>
