<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        .app-frame {
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        @media (min-width: 640px) {
            .app-frame {
                height: calc(100dvh - 2rem);
                margin: 1rem auto;
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 44px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.35s ease-in-out, visibility 0.35s ease-in-out;
        }

        .screen-active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 2;
        }

        .screen-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 1;
        }

        /* Screen 1 Layout */
        #screen1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 24px;
        }

        .ssid-title {
            font-size: 3.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            text-align: center;
        }

        .cta-btn {
            background-color: #1c1c1e;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 32px;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .cta-btn:hover { background-color: #2c2c2e; }
        .cta-btn:active { background-color: #3c3c3e; transform: scale(0.97); }

        /* Screen 2 Layout: 50/50 Split */
        #screen2 {
            display: flex;
            flex-direction: column;
        }

        .top-half {
            position: relative;
            width: 100%;
            height: 50%;
            background-color: #121214;
            overflow: hidden;
        }

        .meme-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.55);
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background-color 0.2s;
        }

        .back-btn:hover { background-color: rgba(0, 0, 0, 0.75); }

        .bottom-half {
            width: 100%;
            height: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px;
            background-color: #000000;
        }

        .glass-card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .label-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .copy-btn {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
            white-space: nowrap;
        }

        .copy-btn:hover { background-color: rgba(255, 255, 255, 0.18); }
        .copy-btn:active { background-color: rgba(255, 255, 255, 0.25); }

        .copy-btn.copied-state {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.5);
        }

        .eye-btn {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .eye-btn:hover { background-color: rgba(255, 255, 255, 0.18); }
        .eye-btn:active { background-color: rgba(255, 255, 255, 0.25); }

        .settings-caption {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .os-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .os-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 8px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .os-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .os-btn:active { background-color: rgba(255, 255, 255, 0.15); }

        .os-btn.ios-alert {
            background-color: rgba(234, 179, 8, 0.2);
            color: #facc15;
            border-color: rgba(234, 179, 8, 0.5);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .icon-sm { width: 16px; height: 16px; flex-shrink: 0; }
        .icon-md { width: 20px; height: 20px; flex-shrink: 0; }
        .icon-lg { width: 24px; height: 24px; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="app-frame">
        
        <!-- Screen 1: Minimalist Name & Button -->
        <div id="screen1" class="screen screen-active">
            <h1 class="ssid-title">G_spot</h1>
            <button type="button" class="cta-btn" onclick="showScreen2()">
                click to find 😉
            </button>
        </div>

        <!-- Screen 2: 50/50 Split -->
        <div id="screen2" class="screen screen-hidden">
            
            <!-- Top Half: Image -->
            <div class="top-half">
                <button type="button" class="back-btn" onclick="showScreen1()">
                    <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Back
                </button>
                <img id="memeImg" 
                     src="travolta-desert.jpeg" 
                     alt="Confused Travolta" 
                     class="meme-image"
                     onerror="tryNextImagePath(this)">
            </div>

            <!-- Bottom Half: Controls -->
            <div class="bottom-half">
                <div class="glass-card">
                    <div class="label-text">PASSWORD</div>
                    
                    <div class="action-row">
                        <button type="button" id="copyBtn" class="copy-btn" onclick="copyPassword()">
                            <svg id="copyIcon" class="icon-md" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            <span id="copyText">Tap to copy password</span>
                        </button>
                        
                        <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Show password">
                            <svg id="eyeIcon" class="icon-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>

                    <p class="settings-caption">Open Wi-Fi Settings</p>
                    <div class="os-grid">
                        <button type="button" id="iosBtn" class="os-btn" onclick="showIosInstructions()">
                            <svg id="iosIcon" class="icon-sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" fill="currentColor">
                                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 24 184.8 8 277.3c-1.9 11.2-1.2 23.3 1.2 35.8 17.5 91.5 73.1 143 114.7 143 37.9 0 54-24 93.3-24 39.3 0 53.6 24.1 94.3 24.1 36.6 0 82.5-43 103-102.3-34.9-15.6-55.6-50.4-55.8-85.2zm-97.4-152.1c15-20.1 27.2-46.7 24-74.1-23.7 2.1-51.4 16.5-67.6 36.4-14.8 18.2-28.5 45.4-24 71.9 26 2.3 50.8-14 67.6-34.2z"/>
                            </svg>
                            <span id="iosText">iPhone</span>
                        </button>

                        <a href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end" class="os-btn">
                            <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" fill="currentColor">
                                <path d="M420.55 301.93a24 24 0 1 1 24-24 24 24 0 0 1-24 24m-265.1 0a24 24 0 1 1 24-24 24 24 0 0 1-24 24m273.7-144.48 47.94-83a10 10 0 1 0-17.27-10h-.05l-48.54 84.07a283.84 283.84 0 0 0-123.23-28.16 287.69 287.69 0 0 0-123.23 28.16l-48.54-84.07a10 10 0 1 0-17.27 10l47.94 83C64.53 202.22 8.24 285.55 0 384h576c-8.24-98.45-64.54-181.78-146.85-226.55"/>
                            </svg>
                            <span>Android</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const password = "Hardtofind!1606";
        let isShowing = false;

        // Try every possible GitHub Pages path and file extension
        const fallbackPaths = [
            './travolta-desert.jpeg',
            '/Wifi-pass/travolta-desert.jpeg',
            'travolta-desert.jpg',
            '/Wifi-pass/travolta-desert.jpg',
            'travolta-desert.JPEG',
            'travolta-desert.JPG',
            'Travolta-desert.jpeg',
            'Travolta-desert.jpg',
            'travolta-desert.gif',
            'travolta-desert.png'
        ];
        let pathIndex = 0;

        function tryNextImagePath(imgElement) {
            if (pathIndex < fallbackPaths.length) {
                imgElement.src = fallbackPaths[pathIndex];
                pathIndex++;
            }
        }

        function showScreen2() {
            document.getElementById('screen1').className = 'screen screen-hidden';
            document.getElementById('screen2').className = 'screen screen-active';
        }

        function showScreen1() {
            document.getElementById('screen2').className = 'screen screen-hidden';
            document.getElementById('screen1').className = 'screen screen-active';
        }

        function togglePassword() {
            isShowing = !isShowing;
            const copyText = document.getElementById('copyText');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (isShowing) {
                copyText.innerText = password;
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
            } else {
                copyText.innerText = "Tap to copy password";
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function copyPassword() {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(password).catch(() => fallbackCopyText(password));
            } else {
                fallbackCopyText(password);
            }

            const btn = document.getElementById('copyBtn');
            const text = document.getElementById('copyText');
            const icon = document.getElementById('copyIcon');
            const originalIcon = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />';

            btn.classList.add('copied-state');
            text.innerText = "Copied!";
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />';

            setTimeout(() => {
                btn.classList.remove('copied-state');
                text.innerText = isShowing ? password : "Tap to copy password";
                icon.innerHTML = originalIcon;
            }, 2000);
        }

        function showIosInstructions() {
            const btn = document.getElementById('iosBtn');
            const text = document.getElementById('iosText');
            const icon = document.getElementById('iosIcon');
            
            btn.classList.add('ios-alert');
            text.innerText = "Open Settings App";
            icon.style.display = "none";

            setTimeout(() => {
                btn.classList.remove('ios-alert');
                text.innerText = "iPhone";
                icon.style.display = "block";
            }, 3000);
        }
    </script>
</body>
</html>
