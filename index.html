<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guest Wi-Fi Setup</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #000000; 
            margin: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Smooth view transitions */
        .view-transition {
            transition: opacity 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">

    <!-- Main Mobile Constraint Container -->
    <div class="max-w-md mx-auto h-[100dvh] w-full bg-black sm:border-[8px] sm:border-gray-900 sm:rounded-[40px] overflow-hidden relative text-white shadow-2xl">
        
        <!-- ============================================== -->
        <!-- VIEW 1: Landing Button & Full-Width Meme       -->
        <!-- ============================================== -->
        <div id="view1" class="absolute inset-0 z-20 flex flex-col view-transition opacity-100 pointer-events-auto">
            
            <!-- Spacer to push the button 40% down -->
            <div class="h-[40%] w-full flex-shrink-0"></div>
            
            <div class="flex flex-col items-center w-full">
                <!-- Dark iOS-styled pill button -->
                <button 
                    onclick="switchView(2)" 
                    class="px-8 py-3.5 bg-[#1c1c1e] text-white rounded-full border border-gray-800 font-medium active:scale-95 transition-transform shadow-lg mb-8">
                    Click to find
                </button>
                
                <img 
                    src="meme.png" 
                    alt="Wi-Fi Meme" 
                    class="w-full h-auto block object-cover"
                >
            </div>
            
        </div>


        <!-- ============================================== -->
        <!-- VIEW 2: Wi-Fi Details & Copy Button            -->
        <!-- ============================================== -->
        <div id="view2" class="absolute inset-0 z-10 flex flex-col view-transition opacity-0 pointer-events-none bg-black">
            
            <!-- Top Navigation Bar -->
            <div class="p-6 pt-8">
                <button onclick="switchView(1)" class="text-blue-500 font-medium text-[17px] flex items-center active:opacity-70 transition-opacity">
                    <svg class="w-6 h-6 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back
                </button>
            </div>
            
            <!-- Centered Content -->
            <div class="flex-1 flex flex-col items-center justify-center pb-24">
                <p class="text-gray-500 text-xs font-semibold tracking-widest uppercase mb-3">Wi-Fi Name</p>
                <h1 class="text-5xl md:text-6xl font-bold mb-12 tracking-tight">G_spot</h1>
                
                <!-- Hidden Password Copy Button -->
                <button 
                    id="copyBtn" 
                    onclick="copyPwd()" 
                    class="w-[80%] max-w-[300px] h-[68px] bg-[#1c1c1e] rounded-2xl flex items-center justify-center transition-colors duration-300 active:scale-95 shadow-lg border border-gray-800">
                    <span id="copyText" class="text-2xl tracking-[0.3em] font-bold mt-1 text-white">••••••••</span>
                </button>
                <p class="text-gray-600 text-sm mt-5">Tap to copy password</p>
            </div>
            
        </div>
        
    </div>

    <!-- ============================================== -->
    <!-- INTERACTIVE SCRIPTS                            -->
    <!-- ============================================== -->
    <script>
        // Handle switching between View 1 and View 2
        function switchView(viewNumber) {
            const v1 = document.getElementById('view1');
            const v2 = document.getElementById('view2');
            
            if (viewNumber === 2) {
                v1.classList.replace('opacity-100', 'opacity-0');
                v1.classList.replace('pointer-events-auto', 'pointer-events-none');
                v2.classList.replace('opacity-0', 'opacity-100');
                v2.classList.replace('pointer-events-none', 'pointer-events-auto');
            } else {
                v2.classList.replace('opacity-100', 'opacity-0');
                v2.classList.replace('pointer-events-auto', 'pointer-events-none');
                v1.classList.replace('opacity-0', 'opacity-100');
                v1.classList.replace('pointer-events-none', 'pointer-events-auto');
            }
        }

        // Handle Password Copying & UI Feedback
        async function copyPwd() {
            const password = "Hardtofind!1606";
            const btn = document.getElementById('copyBtn');
            const txt = document.getElementById('copyText');
            
            // Execute clipboard copy with fallback for maximum compatibility (iOS/Android/iFrames)
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(password);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = password;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }
            } catch (err) {
                console.error("Failed to copy password", err);
            }

            // Visual Success State (iOS Green)
            btn.classList.remove('bg-[#1c1c1e]', 'border-gray-800');
            btn.classList.add('bg-green-500', 'border-green-400');
            
            txt.classList.remove('tracking-[0.3em]', 'text-2xl', 'mt-1');
            txt.classList.add('tracking-normal', 'text-[22px]', 'mt-0', 'flex', 'items-center', 'gap-2');
            txt.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>Copied!`;

            // Revert back to original state after 2 seconds
            setTimeout(() => {
                btn.classList.add('bg-[#1c1c1e]', 'border-gray-800');
                btn.classList.remove('bg-green-500', 'border-green-400');
                
                txt.classList.add('tracking-[0.3em]', 'text-2xl', 'mt-1');
                txt.classList.remove('tracking-normal', 'text-[22px]', 'mt-0', 'flex', 'items-center', 'gap-2');
                txt.innerText = "••••••••";
            }, 2000);
        }
    </script>
</body>
</html>
